name: Containers
# Builds wlt-update and wlt-dns and pushes them to ghcr.io/<owner>/...
on:
  push:
    branches:
      - 'feature/**'
      - master
    paths:
      - 'update-server/**'
      - '.github/workflows/containers.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [wlt-update, wlt-dns]
    steps:
      - uses: actions/checkout@v4
      - name: Owner in lower case
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: update-server/${{ matrix.image }}
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ github.sha }}
