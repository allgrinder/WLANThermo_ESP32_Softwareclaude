name: Gas fork CI
on:
  push:
    branches:
      - 'feature/**'
      - 'claude/**'
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host simulation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run simulator tests
        run: |
          if [ -f test/sim/Makefile ]; then make -C test/sim test; else echo "no host tests yet"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-results
          path: test/sim/out
          if-no-files-found: ignore

  firmware:
    name: Build nanoV3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
      - name: Build
        run: platformio run -e nanoV3 | tee build.log
      - name: Size report
        run: |
          grep -E "^(RAM|Flash):" build.log | tee size.txt
          cp .pio/build/nanoV3/firmware.bin nanoV3.bin
      - uses: actions/upload-artifact@v4
        with:
          name: nanoV3-firmware
          path: |
            nanoV3.bin
            size.txt
