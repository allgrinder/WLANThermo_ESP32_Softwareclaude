name: Release
# Gas fork: only nanoV3, tag schema v1.2.4-gas.N (must start with "v",
# the device rejects other versions)
on:
  # tag push v*, or a push to a feature branch that changes RELEASE_VERSION:
  # that commit is built and tag + release are created (an existing tag is
  # never overwritten). RELEASE_VERSION is used because tag pushes are not
  # possible from every client.
  push:
    tags:
      - 'v*'
    branches:
      - 'feature/**'
    paths:
      - 'RELEASE_VERSION'
  # manual start (only possible when this file is on the default branch)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag, e.g. v1.2.4-gas.1'
        required: true

permissions:
  contents: write

jobs:
  host-tests:
    name: Host simulation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulator
        run: make -C test/sim test

  firmware:
    name: Build nanoV3
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
      - name: Get the version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then V="${GITHUB_REF#refs/tags/}"
          else V="$(tr -d ' \r\n' < RELEASE_VERSION)"; fi
          echo "$V" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-gas\.[0-9]+)?$' || { echo "invalid version $V"; exit 1; }
          echo version=$V >> $GITHUB_OUTPUT
      - name: Build firmware
        run: |
          sed -i -e 's/\/\*REL_VER\*\//#define FIRMWAREVERSION  "${{ steps.get_version.outputs.version }}"/g' ./src/Version.h
          grep FIRMWAREVERSION ./src/Version.h
          platformio run -e nanoV3 | tee build.log
          grep -E "^(RAM|Flash):" build.log
      - name: Collect
        run: |
          mkdir ./artifacts
          cp ./.pio/build/nanoV3/firmware.bin ./artifacts/nanoV3.bin
          sha256sum ./artifacts/nanoV3.bin | tee ./artifacts/nanoV3.bin.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ./artifacts
    outputs:
      version: ${{ steps.get_version.outputs.version }}

  release:
    name: Create release
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: ./firmware
      - name: Create release with nanoV3.bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.firmware.outputs.version }}"
          gh release create "$TAG" ./firmware/nanoV3.bin ./firmware/nanoV3.bin.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "WLANThermo Nano V3 Gas $TAG" \
            --notes "Gas fork release $TAG for WLANThermo Nano V3 (nanoV3.bin). See docs/INSTALL-GAS.md." \
            --prerelease
